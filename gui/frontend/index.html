<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOBIGUARD — Simulation Analytics</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">MOBIGUARD</span>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" data-tab="offline" role="tab" aria-selected="true">Offline Analytics</button>
      <button class="tab" data-tab="live" role="tab" aria-selected="false">Live PEM Monitor</button>
      <button class="tab" data-tab="figures" role="tab" aria-selected="false">Thesis Figures</button>
    </nav>
    <span class="spacer"></span>
    <button class="icon-button" id="refresh" title="Re-scan results_routing/">Refresh data</button>
    <button class="icon-button" id="theme-toggle" title="Toggle light/dark">Theme</button>
  </header>

  <main>
    <div id="health-banner"></div>
    <section id="panel-offline" role="tabpanel" aria-label="Offline Analytics"></section>
    <section id="panel-live" role="tabpanel" aria-label="Live PEM Monitor" hidden></section>
    <section id="panel-figures" role="tabpanel" aria-label="Thesis Figures" hidden></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
